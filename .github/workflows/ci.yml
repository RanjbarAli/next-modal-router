name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir examples/basic build

  compatibility:
    name: Next ${{ matrix.next }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18.20
            next: 14.2.35
            react: 18.2.0
            react_types: 18.3.31
            react_dom_types: 18.3.7
          - node: 20
            next: 15.5.24
            react: 19.2.8
            react_types: 19.2.18
            react_dom_types: 19.2.5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install compatibility versions
        run: pnpm add --workspace-root --save-dev next@${{ matrix.next }} react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react_types }} @types/react-dom@${{ matrix.react_dom_types }}
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
